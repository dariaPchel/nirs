<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRAUDI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen landing-screen">
    <div class="header">
        <div class="logo-text">FRAUDI</div>
    </div>

    <!-- Контент лендинга -->
    <div class="landing-content">

        <!-- Центральный блок с маскотом и плашками -->
        <div class="mascot-container">
            <!-- Плашка SCAM_DETECTED -->
            <div class="floating-badge badge-scam">
                <span>СКАМ_ОБНАРУЖЕН</span>
            </div>

            <!-- Круг с маскотом -->
            <div class="mascot-circle">
                <img src="assets/mascot.png" alt="FRAUDI Detective" class="mascot-img">
            </div>

            <!-- Плашка 24/7_GUARD -->
            <div class="floating-badge badge-guard">
                <span>ЗАЩИТА_24/7</span>
            </div>
        </div>

        <!-- Заголовок -->
        <h1 class="landing-title">
            ТВОЙ ЛИЧНЫЙ<br>
            <span class="title-highlight">ДЕТЕКТОР</span><br>
            ОБМАНА
        </h1>

        <!-- Описание -->
        <p class="landing-description">
            Отправь мне скриншот, ссылку или текст подозрительного сообщения. Я разберусь, кто за этим стоит.
        </p>

                <!-- Блок действий: Карусель + Sticky кнопка -->
        <div class="landing-actions">

            <!-- Обертка карусели (горизонтальный свайп) -->
            <div class="carousel-wrapper">
                <div class="carousel-track">

                    <!-- 1. Проверить номер -->
                    <button class="landing-btn btn-white carousel-btn">
                        <div class="btn-icon btn-icon-lime">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                            </svg>
                        </div>
                        <div class="btn-text">
                            <div class="btn-title">ПРОВЕРИТЬ НОМЕР</div>
                            <div class="btn-subtitle">Узнай, кто звонил</div>
                        </div>
                    </button>

                    <!-- 2. Анализ ссылки -->
                    <button class="landing-btn btn-white carousel-btn">
                        <div class="btn-icon btn-icon-purple">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                            </svg>
                        </div>
                        <div class="btn-text">
                            <div class="btn-title">АНАЛИЗ ССЫЛКИ</div>
                            <div class="btn-subtitle">Безопасно ли?</div>
                        </div>
                    </button>

                    <!-- 3. Меня обманули -->
                    <button class="landing-btn btn-white carousel-btn">
                        <div class="btn-icon btn-icon-lime">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                                <line x1="12" y1="9" x2="12" y2="13"></line>
                                <line x1="12" y1="17" x2="12.01" y2="17"></line>
                            </svg>
                        </div>
                        <div class="btn-text">
                            <div class="btn-title">МЕНЯ ОБМАНУЛИ</div>
                            <div class="btn-subtitle">Что делать?</div>
                        </div>
                    </button>

                </div>
            </div>

            <!-- Sticky кнопка "Начать расследование" -->
            <a href="chat.html" class="landing-btn btn-black sticky-cta">
                <div class="btn-text">
                    <div class="btn-title">НАЧАТЬ РАССЛЕДОВАНИЕ</div>
                </div>
                <div class="btn-arrow btn-arrow-lime">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </a>
        </div>
</div>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
    }
</script>

</body>
</html>
